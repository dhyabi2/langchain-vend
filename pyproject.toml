[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-vend"
version = "0.1.0"
description = "LangChain tools that call the Vend pay-per-call API and settle each call in Nano (XNO) via x402. No signup, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=0.3",
    "httpx>=0.25",
]

[project.optional-dependencies]
live = ["feeless402>=0.2.0"]  # provides nano_pay for the live x402 payment handshake

[tool.setuptools]
packages = ["langchain_vend"]
